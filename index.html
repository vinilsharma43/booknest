<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BookNest — Online Bookstore</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' role='img' aria-label='BookNest logo'%3E%3Ccircle cx='24' cy='24' r='23' fill='%23ebe2d0'/%3E%3Ccircle cx='24' cy='11' r='3' fill='%23a86a6a'/%3E%3Cpath d='M9 18q8-3.5 15 1v16q-7-4.5-15-1z' fill='%234a1f31'/%3E%3Cpath d='M39 18q-8-3.5-15 1v16q7-4.5 15-1z' fill='%236b2c46'/%3E%3Cpath d='M13 36q11 8 22 0' fill='none' stroke='%23a86a6a' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M15 39q9 5 18 0' fill='none' stroke='%23a86a6a' stroke-width='2' stroke-linecap='round' opacity='.6'/%3E%3C/svg%3E">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="wrap"><a class="logo" href="#/" aria-label="BookNest home"><svg viewBox="0 0 48 48" role="img"
                    aria-label="BookNest logo">
                    <circle cx="24" cy="24" r="23" fill="#ebe2d0" />
                    <circle cx="24" cy="11" r="3" fill="#a86a6a" />
                    <path d="M9 18q8-3.5 15 1v16q-7-4.5-15-1z" fill="#4a1f31" />
                    <path d="M39 18q-8-3.5-15 1v16q7-4.5 15-1z" fill="#6b2c46" />
                    <path d="M13 36q11 8 22 0" fill="none" stroke="#a86a6a" stroke-width="2.6" stroke-linecap="round" />
                    <path d="M15 39q9 5 18 0" fill="none" stroke="#a86a6a" stroke-width="2" stroke-linecap="round"
                        opacity=".6" />
                </svg><span class="wm"><span class="wt"><b>BOOK</b><i>NEST</i></span><small>Online
                        bookstore</small></span></a>
            <nav id="nav"></nav><button class="cartbtn" data-act="cart" id="cartbtn" aria-label="Open cart">🛒 Cart <b
                    id="cc">0</b></button>
        </div>
    </header>
    <main id="app"></main>
    <footer>
        <div class="wrap">BookNest — Online Bookstore Management System </div>
    </footer>
    <div class="veil" id="veil" data-act="cart"></div>
    <aside class="drawer" id="drawer" aria-label="Shopping cart"></aside>
    <div class="toast" id="toast" role="status"></div>
    <script src="script.js"></script>
</body>

</html>
